name: Snake Cyber Animation

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: 
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Gerar animação da cobrinha (tema cyber)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-cyber.svg?color_dots=#0A0E12,#04302B,#026E5F,#00C9A7,#00F5C9&color_snake=#FF2E9A
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar na branch output
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Atualiza animação da cobrinha [skip ci]"
